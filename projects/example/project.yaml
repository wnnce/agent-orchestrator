project:
  enabled: false
  id: example
  displayName: Example Service
  description: Example service repository and agent orchestrator demonstration.
  tags: [example, demo, template]

routing:
  projectId: example
  displayName: Example Service
  summary: Example project template for orchestrator tasks, skills, and configurations.
  keywords: [example, demo, template, example-service]
  routingHints:
    - Example project template for demonstration purposes (disabled by default).

# Agent runtime & model configuration
runtime:
  type: codex
  model: deepseek-v4-pro
  reasoningEffort: high
  mcpServers:
    - name: github
      url: https://api.githubcopilot.com/mcp
      http_headers:
        Authorization: "Bearer {env:GITHUB_TOKEN}"

# The project's repository; each session works in its own git worktree of it.
repository:
  url: git@github.com:example/example-service.git
  baseBranch: main
  committer:
    name: orchestrator-bot
    email: bot@example.com
  auth:
    type: token
    token: "{env:GITHUB_TOKEN}"
