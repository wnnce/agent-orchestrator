projects:
  - project:
      enabled: true
      id: example-project
      displayName: Example Project
      description: Backend service project; each session works in its own Git worktree.
      tags: [backend, microservices]
    routing:
      projectId: example-project
      displayName: Example Project
      summary: Backend service.
      keywords: [backend, service, backend-service]
      routingHints: [Use this project for backend service changes.]

    # Agent & MCP Server Configuration
    runtime:
      type: codex
      model: gpt-5-codex
      reasoningEffort: high
      mcpServers:
        - name: db-explorer
          command: mcp-server-postgres
          args: ["--connection-string", "env:DATABASE_URL"]
          required: false
        - name: docs-search
          url: https://mcp.internal.example.com/docs
          auth: env:INTERNAL_MCP_TOKEN

    # The project's repository. The base checkout is synced on startup; every session gets
    # its own git worktree on branch agent/<sessionId>.
    repository:
      url: git@github.com:my-org/backend-service.git
      baseBranch: main
      # path: repos/backend-service # Use an existing local checkout as the base instead
      auth:
        type: ssh-key
        keyPath: /secrets/keys/backend-service.id_ed25519
      committer:
        name: orchestrator-bot
        email: bot@example.com

    # Outbound notifications (inherits global notifications from config.yaml, can override by name)
    # notifications:
    #   - name: feishu # Overrides the global feishu notification endpoint for this project
    #     type: feishu
    #     url: https://open.feishu.cn/open-apis/bot/v2/hook/custom-project-hook
    #     enabled: true
    #   - name: telegram # Overrides global telegram endpoint for this project
    #     type: telegram
