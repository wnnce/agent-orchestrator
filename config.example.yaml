# ==========================================
# Agent Orchestrator Service Configuration
# ==========================================

# 1. HTTP server network settings
server:
  host: 0.0.0.0
  port: 7070

# 2. Logging output level
logging:
  level: info # debug | info | warn | error

# 3. Storage and paths (relative paths resolve from this YAML file's directory)
storage:
  dataDir: .data
  projectsDir: projects
  # artifactDir: .data/artifacts # Optional, defaults to <dataDir>/artifacts
  # databaseUrl: postgres://orchestrator:orchestrator@localhost:5432/orchestrator # Optional, leave blank for in-memory store
  databaseUrl: ""

# 4. Gateway authentication (leave blank for development, set to require Bearer auth)
auth:
  token: ""

# 5. Multi-project router (leave blank to use fast local keyword routing)
router:
  model: ""
  apiKey: ""
  baseUrl: https://api.openai.com/v1

# 6. Default agent runtime settings
runtimes:
  codex:
    apiKey: ""
    # model_provider: "custom"
    # model_providers:
    #   custom:
    #     name: "custom"
    #     base_url: "https://api.example.com/v1"
    #     wire_api: "responses"
    #     requires_openai_auth: true
    # mcpServers: [] # Global servers inherited by projects
  pi:
    defaultProvider: deepseek
    defaultModel: deepseek-flash
    providers:
      deepseek:
        baseUrl: https://api.deepseek.com
        apiKey: ""
        api: openai-responses # Optional wire protocol: openai-responses | openai-completions
        models:
          - id: deepseek-flash
            name: DeepSeek Flash
            contextWindow: 1000000
            maxTokens: 384000
            reasoning: true
            compat:
              requiresReasoningContentOnAssistantMessages: true
              thinkingFormat: deepseek

# 7. External integration channels
channels:
  feishu:
    enabled: false
    verificationToken: "" # Inbound event webhook verification token
    appId: "" # Outbound Bot App ID
    appSecret: "" # Outbound Bot App Secret
    apiBaseUrl: https://open.feishu.cn
  wecom:
    enabled: false
    botId: "" # WeCom intelligent bot BotID (API mode from admin console)
    secret: "" # WeCom intelligent bot Secret
    # wsUrl: wss://openws.work.weixin.qq.com # Optional WebSocket gateway URL, defaults to official gateway

# 8. Outbound notifications (global notification endpoints inherited by all projects)
# Projects inherit all global channels by default; project channels with the same name override global ones.
notifications: []
